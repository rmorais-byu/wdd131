<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WDD 131 - Tarefa: Página do Local</title>
    <meta name="description" content="Página web sobre um local específico desenvolvido para a disciplina WDD 131">
    <meta name="author" content="Rafael Schmaiske de Morais">
    
    <link rel="stylesheet" href="estilos/local.css">

    <script src="scripts/local.js" defer></script>

</head>
<body>
    <header>
        <h1>Título do Local</h1>
    </header>

    <main>

        <section>
            <picture>
                <source media="(min-width768px)" srcset="imagens/lugar-grande.webp">
                <img src="imagens/lugar-pequeno.webp" alt="Foto principal do local" loading="lazy">
            </picture>
        </section>

        <section class="card">
            <h2>Fatos Sobre o Local</h2>
            <ul>
                <li><strong>País:</strong>...</li>
                <li><strong>População:</strong>...</li>
                <li><strong>Idioma:</strong>...</li>
                <li><strong>Moeda:</strong>...</li>
            </ul>
        </section>

        <section class="card">
            <h2>Clima</h2>
            <div class="weather-content">
                <span class="weather-icon"></span>
                <p>Temperatura: <span id="temp">8</span>°C</p>
                <p>Vento: <span id="wind">10</span>km</p>
                <p>Sensação Térmica: <span id="weather">Calculando...</span>km</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span>WDD 131 | Rafael Schmaiske de Morais | Brasil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
